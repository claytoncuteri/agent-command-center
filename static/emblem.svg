<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Agent Command Center emblem</title>
  <!-- Decorative star polygons -->
  <g stroke="#8f83ff" stroke-width="1" fill="none" opacity=".28">
    <polygon points="60,20 95,80 25,80"/>
    <polygon points="60,100 25,40 95,40"/>
  </g>
  <!-- Outer ring + tick marks -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#e6c473" stroke-width="1.5" opacity=".8"/>
  <g stroke="#e6c473" stroke-width="2" opacity=".7">
    <line x1="60" y1="6"   x2="60"  y2="14"/>
    <line x1="60" y1="106" x2="60"  y2="114"/>
    <line x1="6"  y1="60"  x2="14"  y2="60"/>
    <line x1="106" y1="60" x2="114" y2="60"/>
    <line x1="22" y1="22"  x2="27"  y2="27"/>
    <line x1="98" y1="22"  x2="93"  y2="27"/>
    <line x1="22" y1="98"  x2="27"  y2="93"/>
    <line x1="98" y1="98"  x2="93"  y2="93"/>
  </g>
  <!-- Inner dashed ring -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#4fd6ff" stroke-width="1.5" stroke-dasharray="4 7" opacity=".85"/>
  <circle cx="60" cy="15" r="2.6" fill="#4fd6ff"/>
  <!-- Core -->
  <defs>
    <radialGradient id="g-core" cx="50%" cy="45%" r="60%">
      <stop offset="0%"   stop-color="#8fe9ff"/>
      <stop offset="55%"  stop-color="#2b90b8"/>
      <stop offset="100%" stop-color="#0a2634"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="34" fill="url(#g-core)" opacity=".9"/>
  <circle cx="60" cy="60" r="34" fill="none" stroke="#4fd6ff" stroke-width="1.5" opacity=".6"/>
  <!-- Command symbol -->
  <text x="60" y="82" text-anchor="middle" font-size="48" fill="#e6c473"
        font-family="'Share Tech Mono', serif">&#9822;</text>
</svg>
